name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workbench/package-lock.json

      - name: Install package dependencies
        run: npm ci

      - name: Install workbench dependencies
        run: npm --prefix workbench ci

      - name: Verify package and workbench
        run: npm run verify

      - name: Inspect package contents
        run: npm pack --dry-run
